name: Refresh mass times

on:
  # Wed–Sun at 04:00 UTC. By that time newsletters published Fri afternoon
  # through Sat evening have all landed. (UK summer is UTC+1, so 05:00 BST.)
  schedule:
    - cron: "0 4 * * 3,4,5,6,0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Probe (cheap — record Last-Modified + sha256 per parish)
        run: uv run probe.py
        env:
          # probe.py doesn't call the LLM, but loading extractor.py needs the
          # var present (litellm imports check env at module load time)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Extract (LLM call per parish)
        run: uv run main.py --pretty > data/latest.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MASSTIMINGS_MODEL: openai/gpt-4o-mini

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/; then
            echo "no changes — nothing to commit"
            exit 0
          fi
          git add data/
          git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
