<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MK Mass Times — today &amp; tomorrow</title>
<meta name="description" content="Catholic mass times across Milton Keynes and the surrounding area, refreshed from parish newsletters.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9C%9D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fafaf7;
    --card: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #555;
    --rule: #ececec;
    --accent: #6a3e2e;
    --whatsapp: #25D366;
    --pill-bg: #efe8de;
    --pill-ink: #6a3e2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130f;
      --card: #1d1c18;
      --ink: #f1eee7;
      --ink-soft: #a09a8e;
      --rule: #2b2a25;
      --accent: #d8b594;
      --pill-bg: #2c241c;
      --pill-ink: #d8b594;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 32px);
    max-width: 760px;
    margin: 0 auto;
  }
  header { padding: 8px 0 12px; }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subhead { color: var(--ink-soft); font-size: 0.95rem; }
  .meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin: 16px 0 8px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: translateY(1px); }
  button.primary {
    background: var(--whatsapp);
    color: white;
    border-color: var(--whatsapp);
  }
  button.copied { background: var(--pill-bg); color: var(--pill-ink); border-color: var(--pill-bg); }

  .day-block {
    margin: 28px 0 0;
  }
  .day-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  .day-header h2 {
    margin: 0;
    font-size: 1.05rem;
    color: var(--accent);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .day-header .day-date {
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  section.bucket { margin: 16px 0; }
  section.bucket h3 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin: 0 0 6px;
    font-weight: 600;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 12px;
    padding: 12px 14px;
    border-top: 1px solid var(--rule);
    align-items: baseline;
  }
  .row:first-child { border-top: 0; }
  .time {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--accent);
  }
  .where {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .church { font-weight: 500; }
  .parish-tag {
    color: var(--ink-soft);
    font-size: 0.85rem;
    font-style: italic;
  }
  .loc { color: var(--ink-soft); font-size: 0.9rem; }
  .note { color: var(--ink-soft); font-size: 0.85rem; display: block; margin-top: 2px; }
  .pill {
    display: inline-block;
    background: var(--pill-bg);
    color: var(--pill-ink);
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .empty {
    color: var(--ink-soft);
    font-style: italic;
    padding: 12px 14px;
    font-size: 0.92rem;
  }

  footer {
    margin-top: 36px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    color: var(--ink-soft);
    font-size: 0.8rem;
  }
  footer a { color: var(--ink-soft); }

  .skeleton { color: var(--ink-soft); padding: 14px; }
</style>
</head>
<body>

<header>
  <h1>Mass Times — Milton Keynes &amp; Area</h1>
  <div class="subhead" id="subhead">Today &amp; Tomorrow</div>
  <div class="meta" id="meta"></div>
</header>

<div class="actions">
  <button class="primary" id="shareWa">📲 Share on WhatsApp</button>
  <button id="copyBtn">📋 Copy as text</button>
</div>

<div id="dayContainer">
  <div class="skeleton">Loading…</div>
</div>

<footer>
  <p>Data extracted from parish newsletters by AI. Always confirm with the parish before travelling.<br>
  Source: <a href="https://github.com/sabinjose/mkmasstimings" target="_blank" rel="noopener">github.com/sabinjose/mkmasstimings</a></p>
</footer>

<script>
const MASS_TYPES = ["mass", "vigil mass", "service of word", "divine mercy"];
const CONFESSION_TYPES = ["confession"];
const ADORATION_TYPES = ["adoration", "exposition", "rosary", "benediction", "holy hour", "chaplet"];

const $ = (id) => document.getElementById(id);

const FRIENDLY_DAY = (iso) => new Date(iso + "T00:00:00").toLocaleDateString(undefined, {
  weekday: "long", day: "numeric", month: "long"
});

const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
};

const tomorrowISO = () => {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
};

let DATA = null;

function classify(svc) {
  const t = (svc.type || "").toLowerCase();
  if (CONFESSION_TYPES.some(x => t.includes(x))) return "confession";
  if (ADORATION_TYPES.some(x => t.includes(x))) return "adoration";
  if (MASS_TYPES.some(x => t.includes(x))) return "mass";
  return "adoration";
}

function flattenServices(parishes) {
  const out = [];
  for (const p of parishes) {
    if (p.error) continue;
    for (const s of p.services || []) {
      out.push({
        ...s,
        parish: p.parish,
        location: p.location,
        bucket: classify(s),
      });
    }
  }
  return out;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

function placeName(svc) {
  // Prefer specific church when the parish has multiple sites.
  if (svc.church) {
    const loc = svc.church_location || svc.location;
    return { primary: svc.church, secondary: loc, parish: svc.parish };
  }
  return { primary: svc.parish, secondary: svc.location, parish: null };
}

function rowHTML(svc) {
  const time = svc.time || "—";
  const lang = svc.language ? `<span class="pill">${escapeHTML(svc.language)}</span>` : "";
  const note = svc.notes ? `<span class="note">${escapeHTML(svc.notes)}</span>` : "";
  const place = placeName(svc);
  const sec = place.secondary ? `<span class="loc">${escapeHTML(place.secondary)}</span>` : "";
  const tag = place.parish ? `<span class="parish-tag">(${escapeHTML(place.parish)})</span>` : "";
  return `<div class="row">
    <div class="time">${escapeHTML(time)}</div>
    <div>
      <div class="where">
        <span class="church">${escapeHTML(place.primary)}</span>${sec}${tag}${lang}
      </div>
      ${note}
    </div>
  </div>`;
}

function bucketSection(label, services, emptyText) {
  if (!services.length) {
    return `<section class="bucket">
      <h3>${label}</h3>
      <div class="card"><div class="empty">${emptyText}</div></div>
    </section>`;
  }
  const sorted = [...services].sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
  return `<section class="bucket">
    <h3>${label}</h3>
    <div class="card">${sorted.map(rowHTML).join("")}</div>
  </section>`;
}

function dayBlock(label, dateISO, services) {
  const masses = services.filter(s => s.bucket === "mass");
  const conf = services.filter(s => s.bucket === "confession");
  const ador = services.filter(s => s.bucket === "adoration");
  const empty = !services.length;

  return `<div class="day-block">
    <div class="day-header">
      <h2>${label}</h2>
      <span class="day-date">${escapeHTML(FRIENDLY_DAY(dateISO))}</span>
    </div>
    ${empty
      ? `<div class="card"><div class="empty">No services listed for this day yet — newsletters may not cover this date.</div></div>`
      : bucketSection("Masses", masses, "No masses listed.") +
        bucketSection("Confessions", conf, "No confession times listed.") +
        bucketSection("Adoration &amp; Other", ador, "No adoration / other listed.")
    }
  </div>`;
}

function render() {
  if (!DATA) return;
  const all = flattenServices(DATA.parishes);
  const today = todayISO();
  const tomorrow = tomorrowISO();

  const generated = new Date(DATA.generated_at).toLocaleString();
  const parishCount = DATA.parishes.filter(p => !p.error).length;
  $("meta").innerHTML = `<span>Last refreshed: ${escapeHTML(generated)}</span><span>•</span><span>${parishCount} parishes</span>`;

  const todays    = all.filter(s => s.date === today);
  const tomorrows = all.filter(s => s.date === tomorrow);

  $("dayContainer").innerHTML =
    dayBlock("Today",    today,    todays) +
    dayBlock("Tomorrow", tomorrow, tomorrows);
}

function plainTextForDay(label, dateISO, services) {
  const masses = services.filter(s => s.bucket === "mass").sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
  const conf   = services.filter(s => s.bucket === "confession").sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
  const ador   = services.filter(s => s.bucket === "adoration").sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));

  const fmt = (s) => {
    const t = s.time || "—";
    const lang = s.language ? ` (${s.language})` : "";
    const place = placeName(s);
    const where = place.secondary ? `${place.primary}, ${place.secondary}` : place.primary;
    return `• ${t}  ${where}${lang}`;
  };

  const lines = [];
  lines.push(`*${label} — ${FRIENDLY_DAY(dateISO)}*`);
  if (!services.length) {
    lines.push("(no services listed)");
    return lines.join("\n");
  }
  if (masses.length) { lines.push(""); lines.push("*Masses*"); masses.forEach(s => lines.push(fmt(s))); }
  if (conf.length)   { lines.push(""); lines.push("*Confessions*"); conf.forEach(s => lines.push(fmt(s))); }
  if (ador.length)   { lines.push(""); lines.push("*Adoration & Other*"); ador.forEach(s => lines.push(fmt(s))); }
  return lines.join("\n");
}

function buildShareText() {
  const all = flattenServices(DATA.parishes);
  const today = todayISO();
  const tomorrow = tomorrowISO();
  const todays    = all.filter(s => s.date === today);
  const tomorrows = all.filter(s => s.date === tomorrow);

  const out = [];
  out.push(plainTextForDay("Today",    today,    todays));
  out.push("");
  out.push(plainTextForDay("Tomorrow", tomorrow, tomorrows));
  out.push("");
  out.push(`Source: ${location.origin}${location.pathname}`);
  return out.join("\n");
}

async function copyText() {
  const text = buildShareText();
  try {
    await navigator.clipboard.writeText(text);
    const b = $("copyBtn");
    const original = b.textContent;
    b.textContent = "✓ Copied";
    b.classList.add("copied");
    setTimeout(() => { b.textContent = original; b.classList.remove("copied"); }, 1800);
  } catch (e) {
    const w = window.open("", "_blank");
    w.document.write("<pre style='white-space:pre-wrap;font:14px monospace'>" + text.replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"})[c]) + "</pre>");
  }
}

function shareWhatsApp() {
  const text = buildShareText();
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
}

async function load() {
  try {
    const r = await fetch("data/latest.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    render();
  } catch (e) {
    document.body.innerHTML = `<div style="padding:24px"><h1>Couldn't load mass times</h1><p style="color:#888">${escapeHTML(e.message)}</p></div>`;
  }
}

$("copyBtn").addEventListener("click", copyText);
$("shareWa").addEventListener("click", shareWhatsApp);

load();
</script>
</body>
</html>
