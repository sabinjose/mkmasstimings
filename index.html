<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MK Mass Times</title>
<meta name="description" content="Catholic mass times across Milton Keynes and the surrounding area, refreshed from parish newsletters.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9C%9D%EF%B8%8F%3C/text%3E%3C/svg%3E">

<style>
  :root {
    --bg:       #f7f3ec;
    --surface:  #ffffff;
    --ink:      #1a1816;
    --ink-2:    #4d4843;
    --ink-3:    #807a72;
    --rule:     #ebe5db;
    --accent:   #6a3e2e;
    --tag-bg:   #efe4d3;
    --tag-ink:  #6a3e2e;
    --whatsapp: #25d366;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:       #0f0e0c;
      --surface:  #1b1916;
      --ink:      #f5f0e8;
      --ink-2:    #c4bdb1;
      --ink-3:    #8a8378;
      --rule:     #2a2722;
      --accent:   #e9b88f;
      --tag-bg:   #2c2218;
      --tag-ink:  #e9b88f;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 14.5px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: max(env(safe-area-inset-top), 12px) 12px max(env(safe-area-inset-bottom), 28px);
    max-width: 640px;
    margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }
  @media (min-width: 600px) {
    body { padding-left: 18px; padding-right: 18px; font-size: 15px; }
  }

  /* Header */
  header { margin: 4px 0 10px; }
  h1 {
    font-size: 1.15rem;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
    line-height: 1.2;
    font-weight: 700;
  }
  .subhead { color: var(--ink-2); font-size: 0.92rem; font-weight: 500; }
  .meta {
    display: flex; gap: 6px; flex-wrap: wrap;
    font-size: 0.72rem; color: var(--ink-3); margin-top: 4px;
  }
  .meta .dot { opacity: 0.5; }

  /* Toolbar (toggle + actions in one row) */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0 8px;
  }
  .day-toggle {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 2px;
    flex: 0 0 auto;
  }
  .day-toggle button {
    border: 0;
    background: transparent;
    color: var(--ink-2);
    padding: 6px 14px;
    border-radius: 999px;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .day-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  @media (prefers-color-scheme: dark) {
    .day-toggle button.active { color: #1a1410; }
  }
  /* Toggle for including outside-MK parishes — sits in the toolbar.
     Default is off; pressed state matches the day-toggle accent. */
  .scope-btn {
    flex: 0 0 auto;
    color: var(--ink-2);
  }
  .scope-btn[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  @media (prefers-color-scheme: dark) {
    .scope-btn[aria-pressed="true"] { color: #1a1410; }
  }
  .actions { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .actions-bottom {
    margin: 18px 0 4px;
    margin-left: 0;
    justify-content: flex-start;
  }
  .actions-bottom .btn {
    padding: 10px 16px;
    font-size: 0.92rem;
    flex: 1 1 auto;
    justify-content: center;
  }
  @media (min-width: 480px) {
    .actions-bottom .btn { flex: 0 0 auto; }
  }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    font: inherit;
    font-size: 0.82rem;
    font-weight: 500;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--whatsapp);
    color: #fff;
    border-color: var(--whatsapp);
  }
  .btn.copied {
    background: var(--tag-bg);
    color: var(--tag-ink);
    border-color: var(--tag-bg);
  }

  /* Bucket section */
  section.bucket { margin: 12px 0 14px; }
  section.bucket h3 {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-3);
    margin: 0 0 6px;
    font-weight: 700;
  }
  section.bucket h3 .count {
    color: var(--ink-3);
    font-weight: 500;
    font-size: 0.65rem;
  }

  /* Service rows — three-column layout: TIME | TOWN | CHURCH, POSTCODE */
  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 64px minmax(0, 1.1fr) minmax(0, 2fr);
    column-gap: 10px;
    padding: 8px 12px;
    border-top: 1px solid var(--rule);
    align-items: baseline;
  }
  .row:first-child { border-top: 0; }
  .row .time {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--accent);
    line-height: 1.3;
    white-space: nowrap;
  }
  .row .area {
    font-weight: 600;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .row .place {
    color: var(--ink-2);
    overflow-wrap: anywhere;
    line-height: 1.35;
    min-width: 0;
  }
  .row .pc {
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    font-size: 0.85rem;
  }
  .pill {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--tag-ink);
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 1px 6px;
    border-radius: 999px;
    line-height: 1.5;
    vertical-align: middle;
    margin-left: 4px;
  }
  .pill.pill-cancel {
    background: rgba(180, 60, 60, 0.12);
    color: #b43c3c;
  }
  @media (prefers-color-scheme: dark) {
    .pill.pill-cancel {
      background: rgba(255, 130, 130, 0.18);
      color: #ff9b9b;
    }
  }
  .row.cancelled .area  { color: var(--ink-3); }
  .row.cancelled .place { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
  .row.cancelled .time  { color: var(--ink-3); }

  .row .src {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    text-decoration: none;
    margin-left: 6px;
    font-size: 0.85rem;
    font-weight: 700;
    width: 22px;
    height: 22px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    line-height: 1;
    vertical-align: middle;
  }
  .row .src:hover { background: var(--tag-bg); border-color: var(--tag-bg); }
  .row .src:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty {
    color: var(--ink-3);
    padding: 12px;
    text-align: center;
    font-size: 0.88rem;
  }
  .empty.big { padding: 22px 16px; }
  .empty.big strong {
    display: block;
    color: var(--ink-2);
    font-size: 0.95rem;
    margin-bottom: 3px;
    font-weight: 600;
  }

  footer {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    color: var(--ink-3);
    font-size: 0.75rem;
    line-height: 1.5;
  }
  footer p { margin: 4px 0; }
  footer a { color: var(--ink-2); }

  /* Shimmer skeletons used while data/latest.json is loading. */
  .skeleton-section { margin: 12px 0 14px; }
  .skeleton-h { height: 0.7rem; width: 90px; background: var(--rule); border-radius: 4px; margin: 0 0 6px; }
  .skeleton-card .row {
    grid-template-columns: 64px minmax(0,1.1fr) minmax(0,2fr);
  }
  .skeleton-bar {
    height: 0.85rem;
    background: var(--rule);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .skeleton-bar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,255,255,0.45) 50%,
      transparent 100%);
    animation: shimmer 1.4s infinite;
  }
  @media (prefers-color-scheme: dark) {
    .skeleton-bar::after {
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.06) 50%,
        transparent 100%);
    }
  }
  @keyframes shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .skeleton-bar::after { animation: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Mass Times — Milton Keynes &amp; Area</h1>
  <div class="subhead" id="subhead">Loading…</div>
  <div class="meta" id="meta"></div>
</header>

<div class="toolbar">
  <div class="day-toggle" role="tablist" aria-label="Day">
    <button id="btnToday" class="active" type="button" role="tab">Today</button>
    <button id="btnTomorrow" type="button" role="tab">Tomorrow</button>
  </div>
  <button id="btnNearby" class="btn scope-btn" type="button" aria-pressed="false" title="Include parishes outside Milton Keynes when their Masses fill a time-of-day gap">
    + Nearby
  </button>
</div>

<div id="dayContainer">
  <div class="skeleton-section">
    <div class="skeleton-h"></div>
    <div class="card skeleton-card">
      <div class="row"><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div></div>
      <div class="row"><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div></div>
      <div class="row"><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div></div>
      <div class="row"><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div></div>
    </div>
  </div>
  <div class="skeleton-section">
    <div class="skeleton-h"></div>
    <div class="card skeleton-card">
      <div class="row"><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div></div>
      <div class="row"><div class="skeleton-bar"></div><div class="skeleton-bar"></div><div class="skeleton-bar"></div></div>
    </div>
  </div>
</div>

<div class="actions actions-bottom">
  <button class="btn primary" id="shareWa" title="Share on WhatsApp">📲 Share on WhatsApp</button>
  <button class="btn" id="copyBtn" title="Copy as text">📋 Copy</button>
  <button class="btn" id="imageBtn" title="Save the schedule as an image">🖼️ Save image</button>
</div>

<footer>
  <p>AI-extracted from parish newsletters, refreshed Wed–Sun. Always confirm with the parish before travelling.</p>
  <p><a href="https://github.com/sabinjose/mkmasstimings" target="_blank" rel="noopener">github.com/sabinjose/mkmasstimings</a></p>
</footer>

<script>
const MASS_TYPES = ["mass", "vigil mass", "service of word", "divine mercy"];
const CONFESSION_TYPES = ["confession"];
const ADORATION_TYPES = ["adoration", "exposition", "rosary", "benediction", "holy hour", "chaplet"];

const $ = (id) => document.getElementById(id);

const FRIENDLY_DAY = (iso) => new Date(iso + "T00:00:00").toLocaleDateString(undefined, {
  weekday: "long", day: "numeric", month: "long"
});

const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
};
const tomorrowISO = () => {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
};

// "13:45" -> "1:45pm" / "9:00" -> "9am"
function formatTime(t) {
  if (!t) return "—";
  const m = /^(\d{1,2}):(\d{2})$/.exec(t);
  if (!m) return t;
  let h = parseInt(m[1], 10);
  const min = m[2];
  const ampm = h >= 12 ? "pm" : "am";
  h = h % 12; if (h === 0) h = 12;
  return (min === "00") ? `${h}${ampm}` : `${h}:${min}${ampm}`;
}
const timeKey = (t) => t || "99:99";

let DATA = null;
let SELECTED = "today";
// Whether to include parishes outside MK regardless of Mass-gap fallback.
// When false, outside-MK parishes appear only when their Masses fill a time
// bucket (morning / afternoon / evening) that no MK Mass covers — and once
// included, the entire parish (Mass + Confession + Adoration) is shown.
let INCLUDE_NEARBY = (() => {
  try { return localStorage.getItem("include_nearby") === "1"; }
  catch { return false; }
})();

function classify(svc) {
  const t = (svc.type || "").toLowerCase();
  if (CONFESSION_TYPES.some(x => t.includes(x))) return "confession";
  if (ADORATION_TYPES.some(x => t.includes(x))) return "adoration";
  if (MASS_TYPES.some(x => t.includes(x))) return "mass";
  return "adoration";
}

// "No Mass today" notices — keep them but render distinctly so users see
// at a glance that the church is closed for that liturgy. Catches every
// phrasing parishes use: "No Mass", "No Parish Mass", "No morning Mass",
// "No public Mass", "no service today", "Mass cancelled", etc.
const CANCELLATION_RE = /\b(no\s+(?:[a-z]+\s+){0,3}(?:mass|service|liturgy)|mass\s+cancelled)\b/i;
function isCancellation(svc) {
  return CANCELLATION_RE.test(svc.type || "") ||
         CANCELLATION_RE.test(svc.notes || "");
}

function flattenServices(parishes) {
  const out = [];
  for (const p of parishes) {
    if (p.error) continue;
    for (const s of p.services || []) {
      out.push({
        ...s,
        parish: p.parish,
        location: p.location,
        source_url: p.source_url || "",
        outside_mk: !!p.outside_mk,
        // Stable parish key for parish-level inclusion decisions.
        parish_key: p.location || p.parish || "",
        bucket: isCancellation(s) ? "mass" : classify(s),
        cancelled: isCancellation(s),
      });
    }
  }
  return out;
}

// Coarse time-of-day buckets. Used to decide when an outside-MK parish's
// Mass fills a gap left by MK parishes — e.g. if MK has a 9am Mass but no
// evening one, an outside-MK 7pm Mass surfaces.
function timeOfDay(t) {
  if (!t) return "anytime";
  const m = /^(\d{1,2}):/.exec(t);
  if (!m) return "anytime";
  const h = parseInt(m[1], 10);
  if (h < 12) return "morning";
  if (h < 17) return "afternoon";
  return "evening";
}

// Given the day's services, return a predicate (s -> bool) for inclusion.
//
// Rules when the user toggle is OFF:
// - MK parishes: always shown.
// - Outside-MK Mass: shown only when its time-of-day bucket (morning /
//   afternoon / evening) is NOT covered by an MK Mass that day.
// - Outside-MK Confession / Adoration: shown only when its parish has
//   at least one Mass that passed the gap rule above. Other Masses of
//   the same parish that DON'T fill a gap stay hidden — e.g. if MK has
//   a 7pm Mass already, an outside 7pm Mass from a parish whose 10am
//   Mass admitted the parish doesn't tag along.
//
// Toggle ON: every outside-MK service is included, no gap check.
function buildVisibilityFilter(services, includeNearby) {
  if (includeNearby) return () => true;

  const mkMassBuckets = new Set();
  for (const s of services) {
    if (!s.outside_mk && s.bucket === "mass" && !s.cancelled && s.time) {
      mkMassBuckets.add(timeOfDay(s.time));
    }
  }

  const massGapFillers = new WeakSet();
  const massGapParishes = new Set();
  for (const s of services) {
    if (!s.outside_mk) continue;
    if (s.bucket !== "mass" || s.cancelled || !s.time) continue;
    if (!mkMassBuckets.has(timeOfDay(s.time))) {
      massGapFillers.add(s);
      massGapParishes.add(s.parish_key);
    }
  }

  return (s) => {
    if (!s.outside_mk) return true;
    if (s.bucket === "mass") return massGapFillers.has(s);
    return massGapParishes.has(s.parish_key);
  };
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// Rewrite raw text-export URLs to human-friendly viewer URLs.
// Otherwise users see plaintext or get a forced download.
function viewableSourceURL(url) {
  if (!url) return url;
  // Google Docs export → preview viewer
  let m = url.match(/^https?:\/\/docs\.google\.com\/document\/d\/([a-zA-Z0-9_\-]+)\/export(?:\?.*)?$/);
  if (m) return `https://docs.google.com/document/d/${m[1]}/preview`;
  // Drive direct download → preview viewer
  m = url.match(/^https?:\/\/drive\.google\.com\/uc\?.*\bid=([a-zA-Z0-9_\-]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  return url;
}

// Pull the church/area/postcode out of the service entry. main.py enriches
// these against the CHURCHES registry in parishes.py so they're consistent
// regardless of how the LLM phrased the source (e.g. "St Augustine" vs
// "St. Augustine's"). Falls back to the service's own fields if enrichment
// hasn't happened yet (older latest.json).
function placeMeta(svc) {
  return {
    area:     svc.area || svc.church_location || svc.location || "",
    church:   svc.church || svc.parish || "",
    postcode: svc.postcode || "",
  };
}

// ?date=YYYY-MM-DD lets you preview any day (used as Today; Tomorrow shifts +1)
const URL_DATE_OVERRIDE = (() => {
  const v = new URLSearchParams(location.search).get("date");
  return /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : null;
})();
const baseDate = () => URL_DATE_OVERRIDE || todayISO();
const nextDate = () => {
  const d = new Date(baseDate() + "T00:00:00");
  d.setDate(d.getDate() + 1);
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
};
const selectedDate  = () => SELECTED === "tomorrow" ? nextDate() : baseDate();
const selectedLabel = () => SELECTED === "tomorrow" ? "Tomorrow" : "Today";

function rowHTML(svc) {
  const t = svc.cancelled ? "—" : formatTime(svc.time);
  const meta = placeMeta(svc);

  const tags = [];
  if (svc.cancelled) tags.push(`<span class="pill pill-cancel">No Mass</span>`);
  if (svc.language)  tags.push(`<span class="pill">${escapeHTML(svc.language)}</span>`);
  if (svc.source_url) {
    const href = viewableSourceURL(svc.source_url);
    tags.push(`<a class="src" href="${escapeHTML(href)}" target="_blank" rel="noopener" title="Open parish newsletter" aria-label="Open parish newsletter">↗</a>`);
  }
  const tagsHTML = tags.join("");

  const placeText = meta.postcode
    ? `${meta.church}, ${meta.postcode}`
    : meta.church;

  const rowClass = svc.cancelled ? "row cancelled" : "row";

  return `<div class="${rowClass}">
    <div class="time">${escapeHTML(t)}</div>
    <div class="area">${escapeHTML(meta.area)}</div>
    <div class="place">${escapeHTML(placeText)}${tagsHTML}</div>
  </div>`;
}

function bucketSection(label, services, emptyText) {
  const sorted = [...services].sort((a,b) => timeKey(a.time).localeCompare(timeKey(b.time)));
  const inner = sorted.length
    ? sorted.map(rowHTML).join("")
    : `<div class="empty">${emptyText}</div>`;
  return `<section class="bucket">
    <h3>${label}${services.length ? ` <span class="count">${services.length}</span>` : ""}</h3>
    <div class="card">${inner}</div>
  </section>`;
}

function dayBlock(label, dateISO, services) {
  if (!services.length) {
    return `<div class="card"><div class="empty big">
      <strong>No services listed for ${escapeHTML(label.toLowerCase())}.</strong>
      Newsletters typically cover Sun–Sat — check back after the next refresh.
    </div></div>`;
  }
  const masses = services.filter(s => s.bucket === "mass");
  const conf   = services.filter(s => s.bucket === "confession");
  const ador   = services.filter(s => s.bucket === "adoration");

  return [
    bucketSection("Holy Mass", masses, "No masses listed."),
    bucketSection("Confession", conf, "No confessions listed for this day."),
    ador.length ? bucketSection("Adoration", ador, "") : "",
  ].join("");
}

function render() {
  if (!DATA) return;

  const generated = new Date(DATA.generated_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  const parishCount = DATA.parishes.filter(p => !p.error).length;
  $("meta").innerHTML =
    `<span>Refreshed ${escapeHTML(generated)}</span>` +
    `<span class="dot">·</span>` +
    `<span>${parishCount} parishes</span>`;

  $("subhead").textContent = FRIENDLY_DAY(selectedDate());
  $("btnToday").classList.toggle("active",    SELECTED === "today");
  $("btnTomorrow").classList.toggle("active", SELECTED === "tomorrow");

  const all = flattenServices(DATA.parishes);
  const dayServices = all.filter(s => s.date === selectedDate());
  const visible = buildVisibilityFilter(dayServices, INCLUDE_NEARBY);
  const services = dayServices.filter(visible);
  $("dayContainer").innerHTML = dayBlock(selectedLabel(), selectedDate(), services);
  $("btnNearby").setAttribute("aria-pressed", INCLUDE_NEARBY ? "true" : "false");
}

/* ---------- Share / Copy ---------- */

function plainTextForDay(label, dateISO, services) {
  const masses = services.filter(s => s.bucket === "mass").sort((a,b)=>timeKey(a.time).localeCompare(timeKey(b.time)));
  const conf   = services.filter(s => s.bucket === "confession").sort((a,b)=>timeKey(a.time).localeCompare(timeKey(b.time)));
  const ador   = services.filter(s => s.bucket === "adoration").sort((a,b)=>timeKey(a.time).localeCompare(timeKey(b.time)));

  // WhatsApp/Telegram-friendly: bold via *…*, strikethrough via ~…~,
  // single-line rows with " · " separator (which renders nicely as a
  // mid-dot in plain text). Cancellations use a strikethrough + tail
  // marker so they read at a glance.
  const fmt = (s) => {
    const m = placeMeta(s);
    const place = m.postcode ? `${m.church}, ${m.postcode}` : m.church;
    const lang = s.language ? ` · ${s.language}` : "";
    if (s.cancelled) {
      return `— · ${m.area} · ~${place}~ · No Mass`;
    }
    return `${formatTime(s.time)} · ${m.area} · ${place}${lang}`;
  };

  const lines = [];
  lines.push(`*Mass Times — ${label}, ${FRIENDLY_DAY(dateISO)}*`);
  if (!services.length) {
    lines.push("");
    lines.push("_(no services listed)_");
    return lines.join("\n");
  }
  if (masses.length) { lines.push(""); lines.push("*🟠 Holy Mass*"); masses.forEach(s => lines.push(fmt(s))); }
  if (conf.length)   { lines.push(""); lines.push("*🔵 Confession*"); conf.forEach(s => lines.push(fmt(s))); }
  if (ador.length)   { lines.push(""); lines.push("*🟣 Adoration*"); ador.forEach(s => lines.push(fmt(s))); }
  return lines.join("\n");
}

function buildShareText() {
  const all = flattenServices(DATA.parishes);
  const date = selectedDate();
  const dayServices = all.filter(s => s.date === date);
  const visible = buildVisibilityFilter(dayServices, INCLUDE_NEARBY);
  const services = dayServices.filter(visible);
  const host = (location.host || "mkmasstimings.pages.dev").replace(/^www\./, "");
  return [
    plainTextForDay(selectedLabel(), date, services),
    "",
    `🔗 ${host}`,
  ].join("\n");
}

async function copyText() {
  const text = buildShareText();
  try {
    await navigator.clipboard.writeText(text);
    const b = $("copyBtn");
    const original = b.innerHTML;
    b.innerHTML = "✓ Copied";
    b.classList.add("copied");
    setTimeout(() => { b.innerHTML = original; b.classList.remove("copied"); }, 1800);
  } catch (e) {
    const w = window.open("", "_blank");
    w.document.write("<pre style='white-space:pre-wrap;font:14px monospace'>" +
      text.replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])) + "</pre>");
  }
}

function shareWhatsApp() {
  window.open("https://wa.me/?text=" + encodeURIComponent(buildShareText()), "_blank", "noopener");
}

async function load() {
  try {
    const r = await fetch("data/latest.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    render();
  } catch (e) {
    document.body.innerHTML = `<div style="padding:24px"><h1>Couldn't load mass times</h1><p style="color:#888">${escapeHTML(e.message)}</p></div>`;
  }
}

/* ---------- Save as image (html2canvas, lazy-loaded) ---------- */

let _html2canvasPromise = null;
function loadHtml2Canvas() {
  if (_html2canvasPromise) return _html2canvasPromise;
  _html2canvasPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
    s.onload = () => resolve(window.html2canvas);
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return _html2canvasPromise;
}

async function saveAsImage() {
  const btn = $("imageBtn");
  const original = btn.innerHTML;
  btn.innerHTML = "⏳ Generating…";
  btn.disabled = true;
  try {
    const html2canvas = await loadHtml2Canvas();
    // Build a clean off-DOM container so the saved image gets a tidy
    // header and no toolbar / toggle buttons / footer.
    const stage = document.createElement("div");
    stage.style.cssText = `
      position: fixed; left: -9999px; top: 0;
      width: 720px; padding: 24px 28px;
      background: ${getComputedStyle(document.body).backgroundColor};
      color: ${getComputedStyle(document.body).color};
      font: ${getComputedStyle(document.body).font};
    `;
    const date = selectedDate();
    stage.innerHTML = `
      <div style="margin-bottom:14px">
        <div style="font-weight:700; font-size:1.15rem; margin-bottom:2px">
          Mass Times — ${escapeHTML(selectedLabel())}, ${escapeHTML(FRIENDLY_DAY(date))}
        </div>
        <div style="color: var(--ink-3); font-size: 0.78rem">
          mkmasstimings.pages.dev · refreshed ${escapeHTML(new Date(DATA.generated_at).toLocaleDateString(undefined, { dateStyle: "medium" }))}
        </div>
      </div>
      ${$("dayContainer").innerHTML}
    `;
    document.body.appendChild(stage);
    try {
      const canvas = await html2canvas(stage, {
        backgroundColor: getComputedStyle(document.body).backgroundColor,
        scale: window.devicePixelRatio > 1 ? 2 : 1.5,
        useCORS: true,
        logging: false,
      });
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      const filename = `mass-times-${selectedLabel().toLowerCase()}-${date}.png`;
      // Try Web Share API (mobile), else fall back to download.
      const file = new File([blob], filename, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Mass Times" });
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    } finally {
      stage.remove();
    }
    btn.innerHTML = "✓ Saved";
    btn.classList.add("copied");
    setTimeout(() => { btn.innerHTML = original; btn.classList.remove("copied"); }, 1800);
  } catch (e) {
    console.error(e);
    btn.innerHTML = "❌ Failed";
    setTimeout(() => { btn.innerHTML = original; }, 1800);
  } finally {
    btn.disabled = false;
  }
}

$("copyBtn").addEventListener("click", copyText);
$("shareWa").addEventListener("click", shareWhatsApp);
$("imageBtn").addEventListener("click", saveAsImage);
$("btnToday").addEventListener("click", () => { SELECTED = "today"; render(); });
$("btnTomorrow").addEventListener("click", () => { SELECTED = "tomorrow"; render(); });
$("btnNearby").addEventListener("click", () => {
  INCLUDE_NEARBY = !INCLUDE_NEARBY;
  try { localStorage.setItem("include_nearby", INCLUDE_NEARBY ? "1" : "0"); } catch {}
  render();
});

load();
