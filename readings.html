<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Readings — MK Mass Times</title>
<meta name="description" content="Daily Mass readings for the Diocese of Northampton, from Universalis.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">

<style>
  :root {
    --bg:       #f7f3ec;
    --surface:  #ffffff;
    --ink:      #1a1816;
    --ink-2:    #4d4843;
    --ink-3:    #807a72;
    --rule:     #ebe5db;
    --accent:   #6a3e2e;
    --tag-bg:   #efe4d3;
    --tag-ink:  #6a3e2e;
    --reading-fs: 1.05rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:       #0f0e0c;
      --surface:  #1b1916;
      --ink:      #f5f0e8;
      --ink-2:    #c4bdb1;
      --ink-3:    #8a8378;
      --rule:     #2a2722;
      --accent:   #e9b88f;
      --tag-bg:   #2c2218;
      --tag-ink:  #e9b88f;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: max(env(safe-area-inset-top), 12px) 16px max(env(safe-area-inset-bottom), 32px);
    max-width: 720px;
    margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }
  @media (min-width: 600px) {
    body { padding-left: 22px; padding-right: 22px; }
  }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; gap: 8px;
    margin: 4px 0 14px;
    flex-wrap: wrap;
  }
  .back {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--ink-2);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 6px 10px 6px 6px;
    border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .back:hover { background: var(--surface); color: var(--ink); }

  .font-controls {
    margin-left: auto;
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 2px;
  }
  .font-controls button {
    border: 0;
    background: transparent;
    color: var(--ink-2);
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  .font-controls button[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
  }
  @media (prefers-color-scheme: dark) {
    .font-controls button[aria-pressed="true"] { color: #1a1410; }
  }
  .font-controls .a-sm { font-size: 0.78rem; }
  .font-controls .a-md { font-size: 0.95rem; }
  .font-controls .a-lg { font-size: 1.15rem; }

  /* Header */
  header.page-header { margin: 0 0 18px; }
  h1 {
    font-size: 1.45rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    line-height: 1.2;
    font-weight: 700;
  }
  .date-line {
    color: var(--accent);
    font-size: 1rem;
    font-weight: 600;
  }
  .day-line {
    color: var(--ink-3);
    font-size: 0.88rem;
    margin-top: 2px;
  }
  /* Universalis wraps the day name in <div style="text-indent:-3em;
     margin-left:3em"> for hanging-indent on multi-line liturgical
     titles. We render it as a single line so neutralise the offset. */
  .day-line div, .day-line b {
    display: inline;
    margin: 0 !important;
    text-indent: 0 !important;
  }

  /* Reading sections */
  section.reading {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 18px 18px 20px;
    margin: 0 0 14px;
  }
  section.reading h2 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    margin: 0 0 6px;
    font-weight: 700;
  }
  section.reading .source {
    color: var(--accent);
    font-weight: 600;
    font-size: 0.92rem;
    margin-bottom: 10px;
  }
  section.reading .heading {
    font-style: italic;
    color: var(--ink-2);
    font-size: 1rem;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  section.reading .heading div { display: inline; margin: 0; }
  section.reading .text {
    font-size: var(--reading-fs);
    line-height: 1.7;
    color: var(--ink);
  }
  section.reading .text div {
    margin: 0 0 0.6em;
  }
  section.reading .text div:last-child { margin-bottom: 0; }
  section.reading .text i, section.reading .text em {
    font-style: italic;
  }
  /* Universalis ships inline color:#800000 (maroon) for cue text like
     "or: Alleluia". That value is fine on light backgrounds but invisible
     on the dark theme — recolour it to our accent so the cue stays
     visible. The attribute selector targets every inline style that hard-
     codes that maroon, including any nested span. */
  @media (prefers-color-scheme: dark) {
    section.reading [style*="800000"] { color: var(--accent) !important; }
    footer.attribution [style*="800000"] { color: var(--accent) !important; }
  }

  /* Loading + error states */
  .loading, .error {
    text-align: center;
    padding: 32px 16px;
    color: var(--ink-3);
    font-size: 0.95rem;
  }
  .error a { color: var(--accent); }

  /* Footer / copyright */
  footer.attribution {
    margin: 22px 0 8px;
    padding: 12px 4px 0;
    border-top: 1px solid var(--rule);
    font-size: 0.78rem;
    color: var(--ink-3);
    line-height: 1.5;
  }
  footer.attribution div, footer.attribution span { color: inherit; }
  footer.attribution a { color: var(--accent); }
  footer.attribution .read-more {
    display: inline-block;
    margin: 6px 0 14px;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back">← Mass times</a>
  <div class="font-controls" role="group" aria-label="Text size">
    <button class="a-sm" data-size="0.92rem" aria-pressed="false" title="Smaller">A</button>
    <button class="a-md" data-size="1.05rem" aria-pressed="true" title="Default">A</button>
    <button class="a-lg" data-size="1.25rem" aria-pressed="false" title="Larger">A</button>
  </div>
</div>

<header class="page-header">
  <h1>Today's Readings</h1>
  <div class="date-line" id="dateLine">Loading…</div>
  <div class="day-line" id="dayLine"></div>
</header>

<main id="main">
  <div class="loading" id="loadingMsg">Loading today's readings from Universalis…</div>
</main>

<footer class="attribution" id="attribution"></footer>

<script>
"use strict";

// ---------- Date handling ----------
// `?date=YYYY-MM-DD` lets QA preview a specific day. Default: today.
function pickDate() {
  const q = new URLSearchParams(location.search).get("date");
  if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) {
    const [y, m, d] = q.split("-");
    return { iso: q, compact: y + m + d };
  }
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return { iso: `${y}-${m}-${d}`, compact: `${y}${m}${d}` };
}

// ---------- Font size controls ----------
const FONT_KEY = "mkmt-readings-font-size";
function applyFontSize(size) {
  document.documentElement.style.setProperty("--reading-fs", size);
  localStorage.setItem(FONT_KEY, size);
  document.querySelectorAll(".font-controls button").forEach(btn => {
    btn.setAttribute("aria-pressed", btn.dataset.size === size ? "true" : "false");
  });
}
function initFontSize() {
  const saved = localStorage.getItem(FONT_KEY) || "1.05rem";
  applyFontSize(saved);
  document.querySelectorAll(".font-controls button").forEach(btn => {
    btn.addEventListener("click", () => applyFontSize(btn.dataset.size));
  });
}
initFontSize();

// ---------- Universalis JSONP loader ----------
// Universalis returns JSONP that calls a global `universalisCallback(data)`.
// We define it on window before injecting the <script> tag.
const date = pickDate();
const UNIVERSALIS_URL = `https://universalis.com/Europe.England.Northampton/${date.compact}/jsonpmass.js`;
const UNIVERSALIS_HUMAN_URL = `https://universalis.com/Europe.England.Northampton/${date.compact}/mass.htm`;

function showError(msg) {
  document.getElementById("main").innerHTML =
    `<div class="error">${msg} <a href="${UNIVERSALIS_HUMAN_URL}">Open at Universalis →</a></div>`;
}

window.universalisCallback = function (d) {
  try { render(d); }
  catch (e) {
    console.error(e);
    showError("Couldn't display the readings.");
  }
};

const tag = document.createElement("script");
tag.src = UNIVERSALIS_URL;
tag.onerror = () => showError("Couldn't reach Universalis.");
document.head.appendChild(tag);

// 12s safety timeout — JSONP doesn't expose a normal load promise.
setTimeout(() => {
  if (document.getElementById("loadingMsg")) showError("Universalis is taking a while to respond.");
}, 12000);

// ---------- Render ----------
function readingSection(title, payload) {
  if (!payload) return "";
  const heading = payload.heading
    ? `<div class="heading">${payload.heading}</div>` : "";
  const source = payload.source
    ? `<div class="source">${payload.source}</div>` : "";
  return `
    <section class="reading">
      <h2>${title}</h2>
      ${source}
      ${heading}
      <div class="text">${payload.text || ""}</div>
    </section>
  `;
}

function render(d) {
  document.getElementById("dateLine").textContent = d.date || "";
  document.getElementById("dayLine").innerHTML = d.day || "";

  // Order matches the Mass: First Reading → Psalm → (Second Reading on Sundays
  // / solemnities) → Gospel Acclamation → Gospel.
  const html = [
    readingSection("First Reading", d.Mass_R1),
    readingSection("Responsorial Psalm", d.Mass_Ps),
    readingSection("Second Reading", d.Mass_R2),
    readingSection("Gospel Acclamation", d.Mass_GA),
    readingSection("Gospel", d.Mass_G),
  ].join("");

  document.getElementById("main").innerHTML = html;

  // Universalis requires we display their copyright payload.
  const copy = (d.copyright && d.copyright.text) || "";
  document.getElementById("attribution").innerHTML = `
    <a class="read-more" href="${UNIVERSALIS_HUMAN_URL}" target="_blank" rel="noopener">Read at Universalis →</a>
    ${copy}
  `;
}
</script>
</body>
</html>
